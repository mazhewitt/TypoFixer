[package]
name = "typo-fixer"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "test_model_quick"
path = "test_model_quick.rs"

[[bin]]
name = "test_components"
path = "test_components.rs"

[[bin]]
name = "test_production_issue"
path = "test_production_issue.rs"

[[bin]]
name = "debug_specific_input"
path = "debug_specific_input.rs"

[[bin]]
name = "test_production_path"
path = "test_production_path.rs"

[[bin]]
name = "test_production_path_sync"
path = "test_production_path_sync.rs"

[[bin]]
name = "debug_prompt"
path = "debug_prompt.rs"

[dependencies]
# Use cocoa for now - it's more mature for this use case
objc2 = "0.6"
objc2-foundation = "0.3.1"
objc2-app-kit = "0.3"
cocoa = "0.26.1"
objc = "0.2.7"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
accessibility-sys = "0.2.0"
libc = "0.2.174"
global-hotkey = "0.7.0"
once_cell = "1.21.3"
toml_edit = { version = "0.23.4", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = "0.3"
chrono = "0.4.42"
# Candle + CoreML integration for LLM - Updated for new API
candle-core = "0.9.1"
candle-coreml = { path = "../candle-coreml" }
# Async support for model operations
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.99"

[dev-dependencies]
tempfile = "3.22.0"
mockall = "0.13"

[profile.release]
opt-level = 3
strip = true
lto = true

[[bin]]
name = "typo-fixer"
path = "src/main.rs"