[package]
name = "typo-fixer"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "test_model_quick"
path = "test_model_quick.rs"

[[bin]]
name = "test_components"
path = "test_components.rs"

[dependencies]
# Use cocoa for now - it's more mature for this use case
objc2 = "0.6"
objc2-foundation = "0.3.1"
objc2-app-kit = "0.3"
cocoa = "0.26.1"
objc = "0.2.7"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
accessibility-sys = "0.2.0"
libc = "0.2"
global-hotkey = "0.7.0"
once_cell = "1.21.3"
toml_edit = { version = "0.22.27", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = "0.3"
chrono = "0.4.41"
# Candle + CoreML integration for LLM
candle-core = "0.9.1"
# Use local candle-coreml checkout to ensure latest API with ModelConfig/QwenConfig
# Async support for model operations
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
candle-coreml = { path = "../candle-coreml" }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.20.0"
mockall = "0.13"

[profile.release]
opt-level = 3
strip = true
lto = true

[[bin]]
name = "typo-fixer"
path = "src/main.rs"